version: '3.8'

services:
  # 后端 Spring Boot 服务
  backend:
    image: defect-backend:latest
    container_name: defect-backend
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/defect_detection?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8081:8081"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - defect-net

  # 前端 Nginx 服务
  frontend:
    image: defect-frontend:latest
    container_name: defect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - defect-net

  # 关系型数据库 MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: defect-mysql
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=defect_detection
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - defect-net

networks:
  defect-net:
    driver: bridge
