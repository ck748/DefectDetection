version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: defect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: defect_detection
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/defect_detection.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - defect-net

  # Spring Boot 后端服务
  backend:
    build:
      context: ./defectDetection
      dockerfile: Dockerfile
    image: defect-backend:latest
    container_name: defect-backend
    restart: always
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/defect_detection?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8081:8081"
      - "8888:8888"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - defect-net

  # Vue 前端服务 (Nginx)
  frontend:
    build:
      context: ./web/detection
      dockerfile: Dockerfile
    image: defect-frontend:latest
    container_name: defect-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - defect-net

volumes:
  mysql_data:

networks:
  defect-net:
    driver: bridge
